name: Publish GitHub acquisition capability

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version and build
        run: |
          python -m pip install build
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python -m build
      - name: Install built package against public Core baseline
        run: |
          python -m venv /tmp/provider-smoke
          /tmp/provider-smoke/bin/python -m pip install \
            https://github.com/OrbitFabric/orbitfabric/archive/a25917e81c90396df2b189834e83cf852fa4da5f.zip dist/*.whl
          /tmp/provider-smoke/bin/orbitfabric-github-release-source --help
      - name: Publish verified wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --verify-tag --draft \
            --title "GitHub Release Source $GITHUB_REF_NAME" --notes-file docs/releases/0.1.0.md
          mkdir /tmp/published-provider
          gh release download "$GITHUB_REF_NAME" --dir /tmp/published-provider
          python - <<'PY'
          from pathlib import Path
          for local in Path('dist').iterdir():
              assert local.read_bytes() == (Path('/tmp/published-provider') / local.name).read_bytes()
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false
