[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orbitfabric-github-release-source"
version = "0.1.0"
description = "GitHub Releases source provider for exact OrbitFabric adapter release acquisition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "OrbitFabric Contributors" }
]
dependencies = [
  "orbitfabric>=1.3,<2",
  "typer>=0.12"
]

[project.urls]
Homepage = "https://github.com/FAROTECH/orbitfabric-github-release-source"
Repository = "https://github.com/FAROTECH/orbitfabric-github-release-source"
Issues = "https://github.com/FAROTECH/orbitfabric-github-release-source/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
orbitfabric-github-release-source = "orbitfabric_github_release_source.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitfabric_github_release_source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
